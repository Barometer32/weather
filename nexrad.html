<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Weather Lab - NEXRAD</title>

<style>


* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111111;
}

header {
    background: #111111;
    color: white;
    padding: 18px 35px 0;
    border-bottom: 4px solid #16833b;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 4px 0 13px;
    font-size: 15px;
}

nav {
    display: flex;
    gap: 5px;
}

nav a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    font-weight: bold;
    border-radius: 5px 5px 0 0;
}

nav a:hover {
    background: #333333;
}

nav a.active {
    background: #16833b;
}

main {
    max-width: 1300px;
    margin: 0 auto;
    padding: 30px;
}

h2 {
    text-align: center;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #555555;
    margin-bottom: 25px;
    font-size: 16px;
}

.footer {
    margin-top: 20px;
    text-align: center;
    color: #777777;
    font-size: 13px;
}

@media (max-width: 800px) {

    header {
        padding-left: 15px;
        padding-right: 15px;
    }

    main {
        padding: 15px;
    }

    nav a {
        padding: 9px 12px;
    }
}


body {
    padding-bottom: 82px;
}

main {
    max-width: 1150px;
    padding-top: 20px;
}

.radar-heading {
    margin-bottom: 8px;
}

.radar-subtitle {
    text-align: center;
    color: #666666;
    font-size: 14px;
    margin-bottom: 10px;
}

.radar-container {
    max-width: 1000px;
    margin: 0 auto;
}

.radar-image {
    width: 100%;
    height: auto;
    display: block;
    background: #080808;
    border: 1px solid #777777;
}

.radar-info {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-top: 7px;
    font-size: 13px;
    color: #555555;
}

.scan-time {
    font-size: 17px;
    font-weight: bold;
    color: #111111;
}

.status {
    text-align: right;
}


/* ==========================================================
   BOTTOM RADAR CONTROL STRIP
   ========================================================== */

.radar-controls {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 1000;

    background:
        rgba(
            20,
            20,
            20,
            0.97
        );

    border-top:
        3px solid #16833b;

    padding:
        8px 16px 9px;
}

.control-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;

    display: grid;

    grid-template-columns:
        auto
        minmax(180px, 1fr)
        auto;

    align-items: center;

    gap: 13px;
}

.transport {
    display: flex;
    align-items: center;
    gap: 5px;
}

.transport button {
    min-width: 42px;
    height: 38px;

    border:
        1px solid #666666;

    border-radius: 4px;

    background: #303030;

    color: #ffffff;

    font-size: 18px;

    cursor: pointer;
}

.transport button:hover {
    background: #484848;
}

.transport button.play {
    min-width: 58px;

    font-size: 15px;

    font-weight: bold;
}

.transport button:disabled {
    opacity: 0.4;
    cursor: wait;
}

.slider-wrap {
    display: grid;

    grid-template-columns:
        auto
        minmax(100px, 1fr)
        auto;

    align-items: center;

    gap: 10px;

    min-width: 0;
}

.slider-time {
    color: white;

    font-size: 14px;

    font-weight: bold;

    white-space: nowrap;
}

#timeline {
    width: 100%;

    margin: 0;

    accent-color: #20a84a;

    cursor: pointer;
}

#timeline:disabled {
    cursor: wait;
}

.frame-count {
    color: #cccccc;

    font-size: 13px;

    white-space: nowrap;
}

.latest-button {
    border:
        1px solid #666666;

    border-radius: 4px;

    background: #303030;

    color: #ffffff;

    height: 38px;

    padding: 0 13px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    white-space: nowrap;
}

.latest-button:hover {
    background: #484848;
}

.latest-button:disabled {
    opacity: 0.4;
    cursor: wait;
}


@media (max-width: 720px) {

    body {
        padding-bottom: 118px;
    }

    .radar-controls {
        padding:
            7px 8px;
    }

    .control-inner {
        grid-template-columns:
            1fr;

        gap: 6px;
    }

    .transport {
        justify-content: center;
    }

    .slider-wrap {
        grid-template-columns:
            auto
            1fr
            auto;
    }

    .latest-button {
        display: none;
    }

    .radar-info {
        display: block;
        text-align: center;
    }

    .status {
        text-align: center;
        margin-top: 3px;
    }
}

</style>

</head>


<body>


<header>

<h1>
Weather Lab
</h1>

<p>
Twin Cities Local Weather Observations
</p>

<nav>

<a
    href="./"
>
Observations
</a>

<a
    class="active"
    href="nexrad.html"
>
NEXRAD
</a>

</nav>

</header>


<main>

<h2 class="radar-heading">
KMPX NEXRAD
</h2>

<div class="radar-subtitle">

0.5° Base Reflectivity · Last 2 Hours

<br>

10 dBZ minimum · 5 dBZ intervals

</div>


<div class="radar-container">

<img
    id="radar-image"
    class="radar-image"
    alt="KMPX NEXRAD Base Reflectivity"
>

<div class="radar-info">

<div
    id="scan-time"
    class="scan-time"
>
Loading radar...
</div>

<div
    id="status"
    class="status"
>
Loading radar frames...
</div>

</div>

</div>


<div class="footer">

KMPX Level II · Lowest elevation scan

<br>

Actual radar volume times are used.

</div>

</main>


<div class="radar-controls">

<div class="control-inner">


<div class="transport">

<button
    id="previous-button"
    type="button"
    title="Previous frame"
    disabled
>
◀
</button>

<button
    id="play-button"
    class="play"
    type="button"
    disabled
>
Play
</button>

<button
    id="next-button"
    type="button"
    title="Next frame"
    disabled
>
▶
</button>

</div>


<div class="slider-wrap">

<div
    id="slider-time"
    class="slider-time"
>
--
</div>

<input
    id="timeline"
    type="range"
    min="0"
    max="0"
    value="0"
    step="1"
    disabled
>

<div
    id="frame-count"
    class="frame-count"
>
0 / 0
</div>

</div>


<button
    id="latest-button"
    class="latest-button"
    type="button"
    disabled
>
LATEST
</button>


</div>

</div>


<script>

const RADAR_BASE =
    "https://35-255-233-134.sslip.io/radar";

const FRAME_DELAY =
    700;


let frames = [];

let currentIndex = 0;

let playing = false;

let timer = null;


/*
Every radar image is preloaded as an object URL.

After this initial preload, moving the slider switches
between images already stored in browser memory.
*/

const imageCache =
    new Map();


const radarImage =
    document.getElementById(
        "radar-image"
    );

const scanTime =
    document.getElementById(
        "scan-time"
    );

const sliderTime =
    document.getElementById(
        "slider-time"
    );

const status =
    document.getElementById(
        "status"
    );

const frameCount =
    document.getElementById(
        "frame-count"
    );

const timeline =
    document.getElementById(
        "timeline"
    );

const playButton =
    document.getElementById(
        "play-button"
    );

const previousButton =
    document.getElementById(
        "previous-button"
    );

const nextButton =
    document.getElementById(
        "next-button"
    );

const latestButton =
    document.getElementById(
        "latest-button"
    );


function setControlsEnabled(enabled) {

    timeline.disabled =
        !enabled;

    playButton.disabled =
        !enabled;

    previousButton.disabled =
        !enabled;

    nextButton.disabled =
        !enabled;

    latestButton.disabled =
        !enabled;
}


function frameKey(frame) {

    return frame.timestamp;
}


function frameUrl(frame) {

    return (
        RADAR_BASE
        +
        "/"
        +
        frame.file
        +
        "?v="
        +
        encodeURIComponent(
            frame.timestamp
        )
    );
}


async function preloadOneFrame(frame) {

    const key =
        frameKey(
            frame
        );

    if (
        imageCache.has(
            key
        )
    ) {
        return;
    }

    const response =
        await fetch(
            frameUrl(frame),
            {
                cache:
                    "force-cache"
            }
        );

    if (!response.ok) {

        throw new Error(
            "Image HTTP "
            +
            response.status
        );
    }

    const blob =
        await response.blob();

    const objectUrl =
        URL.createObjectURL(
            blob
        );

    imageCache.set(
        key,
        objectUrl
    );
}


async function preloadFrames(newFrames) {

    const missing =
        newFrames.filter(
            frame =>
                !imageCache.has(
                    frameKey(
                        frame
                    )
                )
        );

    if (!missing.length) {
        return;
    }

    let loaded = 0;

    /*
    Preload several images concurrently for speed.
    */

    await Promise.all(
        missing.map(
            async frame => {

                await preloadOneFrame(
                    frame
                );

                loaded++;

                status.textContent =
                    "Preloading "
                    +
                    loaded
                    +
                    " / "
                    +
                    missing.length;
            }
        )
    );
}


function removeUnusedCachedImages(
    newFrames
) {

    const wanted =
        new Set(
            newFrames.map(
                frame =>
                    frameKey(
                        frame
                    )
            )
        );

    for (
        const [
            key,
            objectUrl
        ]
        of imageCache.entries()
    ) {

        if (
            !wanted.has(
                key
            )
        ) {

            URL.revokeObjectURL(
                objectUrl
            );

            imageCache.delete(
                key
            );
        }
    }
}


function displayFrame(index) {

    if (!frames.length) {
        return;
    }

    currentIndex =
        Math.max(
            0,
            Math.min(
                index,
                frames.length - 1
            )
        );

    const frame =
        frames[
            currentIndex
        ];

    const cached =
        imageCache.get(
            frameKey(
                frame
            )
        );

    if (!cached) {
        return;
    }

    radarImage.src =
        cached;

    scanTime.textContent =
        frame.time;

    sliderTime.textContent =
        frame.time;

    timeline.value =
        currentIndex;

    frameCount.textContent =
        (
            currentIndex
            + 1
        )
        +
        " / "
        +
        frames.length;
}


function nextFrame() {

    if (!frames.length) {
        return;
    }

    currentIndex++;

    if (
        currentIndex
        >= frames.length
    ) {
        currentIndex = 0;
    }

    displayFrame(
        currentIndex
    );
}


function previousFrame() {

    if (!frames.length) {
        return;
    }

    currentIndex--;

    if (
        currentIndex < 0
    ) {
        currentIndex =
            frames.length - 1;
    }

    displayFrame(
        currentIndex
    );
}


function startLoop() {

    if (!frames.length) {
        return;
    }

    if (
        timer !== null
    ) {
        clearInterval(
            timer
        );
    }

    timer =
        setInterval(
            nextFrame,
            FRAME_DELAY
        );

    playing = true;

    playButton.textContent =
        "Pause";
}


function stopLoop() {

    if (
        timer !== null
    ) {

        clearInterval(
            timer
        );

        timer = null;
    }

    playing = false;

    playButton.textContent =
        "Play";
}


function toggleLoop() {

    if (playing) {

        stopLoop();

    } else {

        startLoop();
    }
}


function goLatest() {

    stopLoop();

    if (!frames.length) {
        return;
    }

    displayFrame(
        frames.length - 1
    );
}


async function loadFrames() {

    try {

        const response =
            await fetch(
                RADAR_BASE
                +
                "/frames.json?t="
                +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Manifest HTTP "
                +
                response.status
            );
        }

        const newFrames =
            await response.json();

        if (
            !Array.isArray(
                newFrames
            )
            ||
            !newFrames.length
        ) {

            status.textContent =
                "No radar frames available.";

            return;
        }


        const oldSignature =
            frames.map(
                frame =>
                    frame.timestamp
            ).join("|");

        const newSignature =
            newFrames.map(
                frame =>
                    frame.timestamp
            ).join("|");


        if (
            oldSignature
            === newSignature
        ) {

            status.textContent =
                frames.length
                +
                " scans loaded";

            return;
        }


        const hadFrames =
            frames.length > 0;

        const oldTimestamp =
            hadFrames
            ?
            frames[
                currentIndex
            ].timestamp
            :
            null;


        setControlsEnabled(
            false
        );


        await preloadFrames(
            newFrames
        );


        removeUnusedCachedImages(
            newFrames
        );


        frames =
            newFrames;


        timeline.max =
            frames.length - 1;


        /*
        First load always starts on newest scan and PAUSED.
        */

        if (!hadFrames) {

            currentIndex =
                frames.length - 1;

        } else {

            /*
            Preserve the same scan when possible if a new
            scan arrives while user is viewing history.
            */

            const oldPosition =
                frames.findIndex(
                    frame =>
                        frame.timestamp
                        === oldTimestamp
                );

            if (
                oldPosition >= 0
            ) {

                currentIndex =
                    oldPosition;

            } else {

                currentIndex =
                    frames.length - 1;
            }
        }


        displayFrame(
            currentIndex
        );


        setControlsEnabled(
            true
        );


        status.textContent =
            frames.length
            +
            " scans loaded";

    }

    catch (error) {

        console.error(
            error
        );

        status.textContent =
            "Unable to load radar.";

        setControlsEnabled(
            frames.length > 0
        );
    }
}


previousButton.addEventListener(
    "click",
    function () {

        stopLoop();

        previousFrame();
    }
);


playButton.addEventListener(
    "click",
    toggleLoop
);


nextButton.addEventListener(
    "click",
    function () {

        stopLoop();

        nextFrame();
    }
);


latestButton.addEventListener(
    "click",
    goLatest
);


/*
"input" fires continuously during dragging.

Because every frame is already stored in memory,
the image switches immediately.
*/

timeline.addEventListener(
    "input",
    function () {

        stopLoop();

        displayFrame(
            Number(
                timeline.value
            )
        );
    }
);


document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.target
            &&
            event.target.tagName
            === "INPUT"
        ) {
            return;
        }

        if (
            event.key
            === "ArrowLeft"
        ) {

            stopLoop();

            previousFrame();
        }

        if (
            event.key
            === "ArrowRight"
        ) {

            stopLoop();

            nextFrame();
        }

        if (
            event.key
            === " "
        ) {

            event.preventDefault();

            toggleLoop();
        }
    }
);


/*
Load page paused.

There is intentionally NO startLoop() here.
*/

loadFrames();


/*
Check once per minute for a new radar scan.
*/

setInterval(
    loadFrames,
    60000
);


window.addEventListener(
    "beforeunload",
    function () {

        for (
            const objectUrl
            of imageCache.values()
        ) {

            URL.revokeObjectURL(
                objectUrl
            );
        }
    }
);

</script>


</body>

</html>
