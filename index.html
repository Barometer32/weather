<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hopkins NBM Forecast</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #edf2f7;
            color: #111827;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border: 1px solid #d9dee6;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 12px 14px;
            border-bottom: 1px solid #d9dee6;
            background: #f8fafc;
        }

        .title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 4px;
            color: #64748b;
            font-size: 13px;
        }

        .latest {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .green-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            margin-right: 6px;
            border-radius: 50%;
            background: #16a34a;
        }

        .forecast-note {
            padding: 8px 14px;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
            color: #64748b;
            font-size: 12px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            padding: 9px 10px;
            text-align: left;
            background: #f8fafc;
            border-bottom: 1px solid #d9dee6;
            font-size: 12px;
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .time {
            font-weight: 700;
        }

        .loading,
        .error {
            padding: 18px;
        }

        .error {
            color: #b91c1c;
        }

        @media (max-width: 700px) {
            body {
                padding: 8px;
            }

            .card-header {
                align-items: flex-start;
                flex-direction: column;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="card-header">

            <div>
                <h1 class="title">
                    NBM 24-Hour Forecast
                </h1>

                <div class="subtitle">
                    Hopkins, MN
                </div>
            </div>

            <div
                class="latest"
                id="nbm-run"
            >
                Loading...
            </div>

        </div>

        <div class="forecast-note">
            PRECIP and POP are for the hour following the displayed time.
            POP = chance of more than 0.01" precipitation.
        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Temp</th>
                        <th>Dew</th>
                        <th>Wind</th>
                        <th>Precip</th>
                        <th>POP</th>
                        <th>Low</th>
                        <th>Mid</th>
                        <th>High</th>
                    </tr>
                </thead>

                <tbody id="nbm-body">

                    <tr>
                        <td colspan="9" class="loading">
                            Loading NBM forecast...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

function valueOrDash(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "-";
    }

    return value;
}


function roundValue(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "-";
    }

    return Math.round(value);
}


function percent(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "-";
    }

    return Math.round(value) + "%";
}


function precip(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "-";
    }

    return Number(value).toFixed(2);
}


async function loadNBM() {

    const tbody =
        document.getElementById(
            "nbm-body"
        );

    const run =
        document.getElementById(
            "nbm-run"
        );

    try {

        const response = await fetch(
            "data/nbm.json?t="
            + Date.now()
        );

        if (!response.ok) {

            throw new Error(
                "HTTP "
                + response.status
            );
        }

        const data =
            await response.json();

        tbody.innerHTML = "";

        const rows =
            data.forecast || [];

        if (!rows.length) {

            tbody.innerHTML =
                '<tr><td colspan="9" class="error">'
                + 'No NBM forecast data available.'
                + '</td></tr>';

            run.textContent =
                "Unavailable";

            return;
        }

        rows.forEach(row => {

            const tr =
                document.createElement(
                    "tr"
                );

            tr.innerHTML = `
                <td class="time">
                    ${valueOrDash(row.hour)}
                </td>

                <td>
                    ${roundValue(row.temperature_f)}°
                </td>

                <td>
                    ${roundValue(row.dewpoint_f)}°
                </td>

                <td>
                    ${valueOrDash(row.wind)}
                </td>

                <td>
                    ${precip(row.precip_next_hour_inches)}
                </td>

                <td>
                    ${percent(row.pop_next_hour_pct)}
                </td>

                <td>
                    ${percent(row.low_cloud_pct)}
                </td>

                <td>
                    ${percent(row.mid_cloud_pct)}
                </td>

                <td>
                    ${percent(row.high_cloud_pct)}
                </td>
            `;

            tbody.appendChild(
                tr
            );
        });

        run.innerHTML =
            '<span class="green-dot"></span>'
            + 'Run: '
            + valueOrDash(
                data.run_label
            );

    }

    catch (error) {

        tbody.innerHTML =
            '<tr><td colspan="9" class="error">'
            + 'Unable to load NBM forecast.'
            + '</td></tr>';

        run.textContent =
            "Unavailable";

        console.error(
            "NBM error:",
            error
        );
    }
}


loadNBM();

setInterval(
    loadNBM,
    120000
);

</script>

</body>
</html>
