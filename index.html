<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Metro Weather</title>

    <style>
        body {
            margin: 0;
            background: #e8eef5;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .conditions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .label {
            font-size: 18px;
            color: #666;
            margin-bottom: 12px;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
        }

        .wind-value {
            font-size: 34px;
        }

        .updated {
            text-align: center;
            color: #777;
            margin-top: 30px;
            font-size: 14px;
        }

        /*
         * Phone layout
         */
        @media (max-width: 600px) {

            body {
                background: #eef3f8;
            }

            .container {
                margin: 0;
                padding: 16px;
            }

            h1 {
                font-size: 25px;
                margin-top: 10px;
                margin-bottom: 4px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .conditions {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .card {
                padding: 18px 20px;
                border-radius: 14px;

                display: flex;
                justify-content: space-between;
                align-items: center;

                text-align: left;
            }

            .label {
                font-size: 18px;
                margin-bottom: 0;
            }

            .value {
                font-size: 30px;
            }

            .wind-value {
                font-size: 24px;
                text-align: right;
            }

            .updated {
                font-size: 12px;
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Metro Current Conditions</h1>

    <div class="subtitle">
        Combined KFCM • KMIC • KMSP
    </div>

    <div class="conditions">

        <div class="card">
            <div class="label">
                Temperature
            </div>

            <div class="value" id="temperature">
                --
            </div>
        </div>


        <div class="card">
            <div class="label">
                Dew Point
            </div>

            <div class="value" id="dewpoint">
                --
            </div>
        </div>


        <div class="card">
            <div class="label">
                Wind
            </div>

            <div class="value wind-value" id="wind">
                --
            </div>
        </div>

    </div>

    <div class="updated" id="updated">
        Loading latest observations...
    </div>

</div>


<script>
async function loadWeather() {

    try {

        const response = await fetch(
            "data/current.json?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("Unable to load weather data");
        }

        const data = await response.json();

        const current = data.current_conditions;


        document.getElementById(
            "temperature"
        ).textContent =
            current.temperature_f + "°F";


        document.getElementById(
            "dewpoint"
        ).textContent =
            current.dewpoint_f + "°F";


        document.getElementById(
            "wind"
        ).textContent =
            current.wind;


        const updateTime =
            new Date(data.updated_utc);


        document.getElementById(
            "updated"
        ).textContent =
            "Updated: " +
            updateTime.toLocaleString();

    }

    catch (error) {

        document.getElementById(
            "updated"
        ).textContent =
            "Weather data unavailable";

        console.error(error);
    }
}


loadWeather();
</script>

</body>
</html>
