<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Metro Weather</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #edf1f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #20252a;
        }

        .page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px;
        }

        .section {
            background: white;
            border: 1px solid #d9dee4;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background: #f6f8fa;
            border-bottom: 1px solid #e1e5e9;
        }

        .section-title {
            font-size: 17px;
            font-weight: bold;
        }

        .section-subtitle {
            color: #6e747a;
            font-size: 12px;
            margin-top: 2px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #999;
        }

        .status-dot.good {
            background: #1ba64b;
        }

        .status-dot.waiting {
            background: #e5a000;
        }

        .status-dot.bad {
            background: #d93025;
        }

        .current-grid {
            display: grid;
            grid-template-columns:
                1fr 1fr 1.5fr;
        }

        .current-item {
            padding: 13px 15px;
            border-right: 1px solid #e5e8eb;
        }

        .current-item:last-child {
            border-right: none;
        }

        .label {
            color: #747a80;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 3px;
        }

        .value {
            font-size: 27px;
            font-weight: bold;
        }

        .wind-value {
            font-size: 21px;
        }

        .valid-time {
            padding: 7px 12px;
            border-top: 1px solid #e5e8eb;
            font-size: 12px;
            color: #5d6369;
            background: #fafbfc;
        }

        .history-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f7f8fa;
            color: #61676d;
            font-size: 11px;
            text-align: left;
            padding: 7px 9px;
            border-bottom: 1px solid #dfe3e7;
        }

        td {
            padding: 7px 9px;
            border-bottom: 1px solid #eceff1;
            font-size: 13px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .history-time {
            font-weight: bold;
            white-space: nowrap;
        }

        .small-green-dot,
        .small-red-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .small-green-dot {
            background: #1ba64b;
        }

        .small-red-dot {
            background: #d93025;
        }

        .unavailable {
            color: #b3261e;
        }

        @media (max-width: 600px) {

            .page {
                padding: 6px;
            }

            .section {
                margin-bottom: 7px;
                border-radius: 6px;
            }

            .section-header {
                padding: 8px 9px;
            }

            .section-title {
                font-size: 15px;
            }

            .section-subtitle {
                font-size: 10px;
            }

            .status {
                font-size: 10px;
            }

            .current-grid {
                grid-template-columns:
                    1fr 1fr;
            }

            .current-item {
                padding: 9px 10px;
            }

            .current-item:nth-child(2) {
                border-right: none;
            }

            .current-item:last-child {
                grid-column: 1 / -1;
                border-top: 1px solid #e5e8eb;
                border-right: none;
            }

            .label {
                font-size: 9px;
            }

            .value {
                font-size: 23px;
            }

            .wind-value {
                font-size: 19px;
            }

            .valid-time {
                font-size: 10px;
                padding: 6px 9px;
            }

            table {
                min-width: 400px;
            }

            th {
                font-size: 9px;
                padding: 6px 7px;
            }

            td {
                font-size: 11px;
                padding: 6px 7px;
            }
        }

    </style>

</head>


<body>

<div class="page">

    <section class="section">

        <div class="section-header">

            <div>

                <div class="section-title">
                    Metro Current Conditions
                </div>

                <div class="section-subtitle">
                    KFCM • KMIC • KMSP
                </div>

            </div>


            <div class="status">

                <span
                    class="status-dot"
                    id="qualityDot"
                ></span>

                <span id="qualityText">
                    Checking
                </span>

            </div>

        </div>


        <div class="current-grid">

            <div class="current-item">

                <div class="label">
                    Temperature
                </div>

                <div
                    class="value"
                    id="temperature"
                >
                    --
                </div>

            </div>


            <div class="current-item">

                <div class="label">
                    Dew Point
                </div>

                <div
                    class="value"
                    id="dewpoint"
                >
                    --
                </div>

            </div>


            <div class="current-item">

                <div class="label">
                    Wind
                </div>

                <div
                    class="value wind-value"
                    id="wind"
                >
                    --
                </div>

            </div>

        </div>


        <div
            class="valid-time"
            id="validTime"
        >
            Loading observations...
        </div>

    </section>


    <section class="section">

        <div class="section-header">

            <div>

                <div class="section-title">
                    12-Hour Trend
                </div>

                <div class="section-subtitle">
                    Hourly metro averages
                </div>

            </div>

        </div>


        <div class="history-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Time</th>
                        <th>Temp</th>
                        <th>Dew</th>
                        <th>Wind</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="historyBody">
                </tbody>

            </table>

        </div>

    </section>

</div>


<script>

async function loadWeather() {

    try {

        const response = await fetch(
            "data/current.json?t="
            + Date.now()
        );

        if (!response.ok) {

            throw new Error(
                "Unable to load weather data"
            );

        }

        const data =
            await response.json();

        displayCurrent(data);
        displayHistory(data);

    }

    catch (error) {

        document.getElementById(
            "temperature"
        ).textContent =
            "Unavailable";

        document.getElementById(
            "dewpoint"
        ).textContent =
            "Unavailable";

        document.getElementById(
            "wind"
        ).textContent =
            "Unavailable";

        const dot =
            document.getElementById(
                "qualityDot"
            );

        dot.classList.add(
            "bad"
        );

        document.getElementById(
            "qualityText"
        ).textContent =
            "Unavailable";

        console.error(error);

    }

}


function displayCurrent(data) {

    const current =
        data.current_conditions;

    const quality =
        data.quality;

    const dot =
        document.getElementById(
            "qualityDot"
        );

    dot.classList.remove(
        "good",
        "waiting",
        "bad"
    );

    if (
        current.available
        && quality.new_hour_ready
    ) {

        dot.classList.add(
            "good"
        );

        document.getElementById(
            "qualityText"
        ).textContent =
            "Verified";

    }

    else if (
        current.available
        && !quality.new_hour_ready
    ) {

        dot.classList.add(
            "waiting"
        );

        document.getElementById(
            "qualityText"
        ).textContent =
            "Waiting for new hour";

    }

    else {

        dot.classList.add(
            "bad"
        );

        document.getElementById(
            "qualityText"
        ).textContent =
            "Unavailable";

    }


    if (current.available) {

        document.getElementById(
            "temperature"
        ).textContent =
            current.temperature_f
            + "°F";

        document.getElementById(
            "dewpoint"
        ).textContent =
            current.dewpoint_f
            + "°F";

        document.getElementById(
            "wind"
        ).textContent =
            current.wind;

    }

    else {

        document.getElementById(
            "temperature"
        ).textContent =
            "Unavailable";

        document.getElementById(
            "dewpoint"
        ).textContent =
            "Unavailable";

        document.getElementById(
            "wind"
        ).textContent =
            "Unavailable";

    }


    let detailText;

    if (
        quality.new_hour_ready
    ) {

        detailText =
            "Valid for "
            + current.display_time
            + " • 3 of 3 stations verified"
            + " • reports :50–:59";

    }

    else if (
        current.available
    ) {

        detailText =
            "Showing "
            + current.display_time
            + " verified conditions"
            + " • waiting for new hour";

        if (
            quality.missing_stations
            && quality.missing_stations.length
            > 0
        ) {

            detailText +=
                " • missing "
                + quality.missing_stations.join(
                    ", "
                );

        }

    }

    else {

        detailText =
            "Current conditions unavailable";

    }


    document.getElementById(
        "validTime"
    ).textContent =
        detailText;

}


function displayHistory(data) {

    const body =
        document.getElementById(
            "historyBody"
        );

    body.innerHTML = "";

    data.history.forEach(
        function(hour) {

            const row =
                document.createElement(
                    "tr"
                );

            if (hour.available) {

                row.innerHTML =
                    "<td class='history-time'>"
                    + hour.display_time
                    + "</td>"

                    + "<td>"
                    + hour.temperature_f
                    + "°"
                    + "</td>"

                    + "<td>"
                    + hour.dewpoint_f
                    + "°"
                    + "</td>"

                    + "<td>"
                    + hour.wind
                    + "</td>"

                    + "<td>"
                    + "<span class='small-green-dot'></span>"
                    + "OK"
                    + "</td>";

            }

            else {

                row.innerHTML =
                    "<td class='history-time'>"
                    + hour.display_time
                    + "</td>"

                    + "<td>—</td>"

                    + "<td>—</td>"

                    + "<td class='unavailable'>"
                    + "Unavailable"
                    + "</td>"

                    + "<td class='unavailable'>"
                    + "<span class='small-red-dot'></span>"
                    + "Unavailable"
                    + "</td>";

            }

            body.appendChild(
                row
            );

        }
    );

}


loadWeather();

</script>

</body>

</html>
