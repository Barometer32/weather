<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>Weather Lab</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<header class="site-header">

    <div class="header-inner">

        <h1>
            Weather Lab
        </h1>

        <div class="subtitle">
            Twin Cities Local Weather Observations
        </div>

    </div>


    <nav class="tabs">

        <a
            href="/weather/"
            class="active"
        >
            Observations
        </a>

        <a href="#">
            Radar
        </a>

        <a href="#">
            Satellite
        </a>

    </nav>

</header>


<main class="page">

    <section class="current-section">

        <h2>
            Current Conditions
        </h2>

        <div class="description">
            KMSP + KFCM averaged observation
        </div>

        <div
            class="updated"
            id="updated"
        >
            Loading...
        </div>


        <div class="condition-grid">

            <div class="condition-card">

                <div class="card-label">
                    Temperature
                </div>

                <div
                    class="card-value"
                    id="temperature"
                >
                    --
                </div>

            </div>


            <div class="condition-card">

                <div class="card-label">
                    Dew Point
                </div>

                <div
                    class="card-value"
                    id="dewpoint"
                >
                    --
                </div>

            </div>


            <div class="condition-card">

                <div class="card-label">
                    Wind
                </div>

                <div
                    class="card-value"
                    id="wind"
                >
                    --
                </div>

            </div>


            <div class="condition-card">

                <div class="card-label">
                    Current Sun Angle
                </div>

                <div
                    class="card-value"
                    id="sun-angle"
                >
                    --
                </div>

                <div
                    class="card-small"
                    id="sun-updated"
                >
                </div>

            </div>

        </div>

    </section>


    <section class="history-section">

        <h2>
            Last 12 Hours
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Time
                        </th>

                        <th>
                            Temp
                        </th>

                        <th>
                            Dew Point
                        </th>

                        <th>
                            Wind
                        </th>

                    </tr>

                </thead>


                <tbody id="history-body">

                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

async function loadWeather() {

    try {

        const response =
            await fetch(
                "data/weather.json?t="
                + Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "HTTP "
                + response.status
            );

        }

        const data =
            await response.json();

        const current =
            data.current;


        document.getElementById(
            "temperature"
        ).textContent =
            current.temperature
            + "°";


        document.getElementById(
            "dewpoint"
        ).textContent =
            current.dewpoint
            + "°";


        document.getElementById(
            "wind"
        ).textContent =
            current.wind_direction
            + " "
            + current.wind_speed
            + " mph";


        document.getElementById(
            "updated"
        ).textContent =
            "Updated: "
            + current.display_time;


        if (
            data.sun_angle !== null
            &&
            data.sun_angle !== undefined
        ) {

            document.getElementById(
                "sun-angle"
            ).textContent =
                data.sun_angle
                + "°";

        }

        else {

            document.getElementById(
                "sun-angle"
            ).textContent =
                "--";

        }


        if (
            data.sun_angle_updated
        ) {

            document.getElementById(
                "sun-updated"
            ).textContent =
                "As of "
                + data.sun_angle_updated;

        }

        else {

            document.getElementById(
                "sun-updated"
            ).textContent =
                "";

        }


        const tbody =
            document.getElementById(
                "history-body"
            );

        tbody.innerHTML =
            "";


        data.history.forEach(
            item => {

                const row =
                    document.createElement(
                        "tr"
                    );


                const timeCell =
                    document.createElement(
                        "td"
                    );

                timeCell.textContent =
                    item.display_time;


                const tempCell =
                    document.createElement(
                        "td"
                    );

                tempCell.textContent =
                    item.temperature
                    + "°F";


                const dewCell =
                    document.createElement(
                        "td"
                    );

                dewCell.textContent =
                    item.dewpoint
                    + "°F";


                const windCell =
                    document.createElement(
                        "td"
                    );

                windCell.textContent =
                    item.wind_direction
                    + " "
                    + item.wind_speed
                    + " mph";


                row.appendChild(
                    timeCell
                );

                row.appendChild(
                    tempCell
                );

                row.appendChild(
                    dewCell
                );

                row.appendChild(
                    windCell
                );


                tbody.appendChild(
                    row
                );

            }
        );

    }

    catch(error) {

        console.error(
            "Unable to load weather data:",
            error
        );


        document.getElementById(
            "updated"
        ).textContent =
            "Unable to load weather data";

    }

}


loadWeather();


setInterval(
    loadWeather,
    60000
);

</script>


</body>

</html>
