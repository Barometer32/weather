<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hopkins NBM Forecast</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #edf2f7;
            color: #111827;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border: 1px solid #d9dee6;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            padding: 12px 14px;
            border-bottom: 1px solid #d9dee6;

            background: #f8fafc;
        }

        .title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 4px;
            color: #64748b;
            font-size: 13px;
        }

        .latest {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .green-dot {
            display: inline-block;

            width: 9px;
            height: 9px;

            margin-right: 6px;

            border-radius: 50%;

            background: #16a34a;
        }

        .forecast-note {
            padding: 8px 14px;

            border-bottom: 1px solid #e5e7eb;

            color: #64748b;
            font-size: 12px;

            background: #ffffff;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: max-content;
            min-width: 100%;

            border-collapse: collapse;

            font-size: 14px;
        }

        th {
            min-width: 76px;

            padding: 9px 10px;

            text-align: center;

            background: #f8fafc;

            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #d9dee6;

            font-size: 12px;

            white-space: nowrap;
        }

        td {
            min-width: 76px;

            padding: 9px 10px;

            text-align: center;

            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;

            white-space: nowrap;
        }

        th:first-child,
        td:first-child {
            min-width: 95px;

            position: sticky;
            left: 0;

            text-align: left;
            font-weight: 700;

            background: #f8fafc;

            z-index: 2;
        }

        thead th:first-child {
            z-index: 3;
        }


        /* ------------------------------------------
           CLOUD LAYERS
           ------------------------------------------ */

        .high-row td {
            background: #f1f5f9;
        }

        .mid-row td {
            background: #f8fafc;
        }

        .low-row td {
            background: #ffffff;
        }

        .high-row td:first-child,
        .mid-row td:first-child,
        .low-row td:first-child {
            background: #f8fafc;
        }


        /* ------------------------------------------
           GROUP DIVIDERS
           ------------------------------------------ */

        .temp-row td {
            border-top: 3px solid #cbd5e1;
        }

        .wind-row td {
            border-top: 3px solid #cbd5e1;
        }

        .pop-row td {
            border-top: 3px solid #cbd5e1;
        }


        /* ------------------------------------------
           SPECIAL ROW COLORS
           ------------------------------------------ */

        .temp-row td:not(:first-child) {
            font-weight: 700;
        }

        .pop-row td:not(:first-child) {
            color: #0369a1;
            font-weight: 600;
        }

        .precip-row td:not(:first-child) {
            color: #075985;
            font-weight: 600;
        }


        .loading,
        .error {
            padding: 18px;

            text-align: left;
        }

        .error {
            color: #b91c1c;
        }


        @media (max-width: 700px) {

            body {
                padding: 8px;
            }

            .card-header {
                align-items: flex-start;
                flex-direction: column;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                min-width: 70px;

                padding: 8px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <div class="card">

        <div class="card-header">

            <div>

                <h1 class="title">
                    NBM 24-Hour Forecast
                </h1>

                <div class="subtitle">
                    Hopkins, MN
                </div>

            </div>

            <div
                class="latest"
                id="nbm-run"
            >
                Loading...
            </div>

        </div>


        <div class="forecast-note">

            Forecast hours run left to right.

            POP = chance of more than 0.01" precipitation
            during the following hour.

            PRECIP = forecast precipitation amount during
            the following hour.

        </div>


        <div
            class="table-wrap"
            id="nbm-wrap"
        >

            <div class="loading">
                Loading NBM forecast...
            </div>

        </div>

    </div>

</div>


<script>


function valueOrDash(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "-";
    }

    return value;
}


function temperature(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "-";
    }

    return Math.round(value) + "°";
}


function percent(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "-";
    }

    return Math.round(value) + "%";
}


function precip(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "-";
    }

    return Number(value).toFixed(2);
}


function createRow(
    label,
    rows,
    field,
    formatter,
    className
) {

    let html =
        '<tr class="' +
        className +
        '">';

    html +=
        "<td>" +
        label +
        "</td>";

    rows.forEach(row => {

        html +=
            "<td>" +
            formatter(
                row[field]
            ) +
            "</td>";

    });

    html += "</tr>";

    return html;
}


async function loadNBM() {

    const wrap =
        document.getElementById(
            "nbm-wrap"
        );

    const run =
        document.getElementById(
            "nbm-run"
        );


    try {

        const response =
            await fetch(
                "data/nbm.json?t="
                + Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP "
                + response.status
            );
        }


        const data =
            await response.json();


        const rows =
            data.forecast || [];


        if (!rows.length) {

            wrap.innerHTML =
                '<div class="error">'
                + 'No NBM forecast data available.'
                + '</div>';

            run.textContent =
                "Unavailable";

            return;
        }


        let html =
            "<table>";


        /* ==========================================
           TIME
           ========================================== */

        html +=
            "<thead><tr>";

        html +=
            "<th>TIME</th>";


        rows.forEach(row => {

            html +=
                "<th>"
                + valueOrDash(
                    row.hour
                )
                + "</th>";

        });


        html +=
            "</tr></thead>";


        html +=
            "<tbody>";


        /* ==========================================
           CLOUDS

           Highest layer first so the visual layout
           resembles the atmosphere vertically.
           ========================================== */

        html += createRow(
            "HIGH",
            rows,
            "high_cloud_pct",
            percent,
            "high-row"
        );


        html += createRow(
            "MID",
            rows,
            "mid_cloud_pct",
            percent,
            "mid-row"
        );


        html += createRow(
            "LOW",
            rows,
            "low_cloud_pct",
            percent,
            "low-row"
        );


        /* ==========================================
           TEMPERATURE
           ========================================== */

        html += createRow(
            "TEMP",
            rows,
            "temperature_f",
            temperature,
            "temp-row"
        );


        /* ==========================================
           DEW POINT
           ========================================== */

        html += createRow(
            "DEW",
            rows,
            "dewpoint_f",
            temperature,
            "dew-row"
        );


        /* ==========================================
           WIND
           ========================================== */

        html += createRow(
            "WIND",
            rows,
            "wind",
            valueOrDash,
            "wind-row"
        );


        /* ==========================================
           PRECIPITATION PROBABILITY
           ========================================== */

        html += createRow(
            "POP",
            rows,
            "pop_next_hour_pct",
            percent,
            "pop-row"
        );


        /* ==========================================
           PRECIPITATION AMOUNT
           ========================================== */

        html += createRow(
            "PRECIP",
            rows,
            "precip_next_hour_inches",
            precip,
            "precip-row"
        );


        html +=
            "</tbody></table>";


        wrap.innerHTML =
            html;


        run.innerHTML =
            '<span class="green-dot"></span>'
            + 'Run: '
            + valueOrDash(
                data.run_label
            );

    }


    catch (error) {

        wrap.innerHTML =
            '<div class="error">'
            + 'Unable to load NBM forecast.'
            + '</div>';

        run.textContent =
            "Unavailable";


        console.error(
            "NBM error:",
            error
        );
    }
}


loadNBM();


setInterval(
    loadNBM,
    120000
);


</script>

</body>
</html>
